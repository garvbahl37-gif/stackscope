# Canonical technology taxonomy — maps ~600 raw survey option labels (9 years, 13 questions) onto
# one name per technology. Stack Overflow renames options, merges and splits them, and moves them
# between questions from year to year; this file is the single source of truth for undoing that.
#
# Entry forms
#   - Name                                  raw label == canonical name
#   - {name: X, aliases: [...]}             several raw labels roll up to X (union within a year)
#   - {..., fields: [database]}             only match labels that came from those question groups
#   - {..., note: "..."}                    a known series break, surfaced in the dashboard
#
# Question groups: language, database, platform, webframe, misctech, toolstech, framework (2017-18),
#                  ide, ai (2023 pools AISearch + AIDev; 2024 AISearchDev), ai_models (2025)

categories:
  language: Languages
  database: Databases
  cloud: Cloud Platforms
  webframe: Web Frameworks & Runtimes
  library: Libraries & Frameworks
  devops: DevOps & Infrastructure
  buildtool: Build & Package Tools
  ide: IDEs & Editors
  ai: AI Assistants & Models

