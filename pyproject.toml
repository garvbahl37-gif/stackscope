[project]
name = "stackscope"
version = "1.0.0"
description = "StackScope — developer technology market intelligence: a 9-year, 600k-respondent survey warehouse with adoption, positioning, retention, compensation, segmentation and GenAI analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "networkx>=3.3",
  "umap-learn>=0.5.6",
  "country_converter>=1.2",
  "pyyaml>=6",
  "requests>=2.32",
  "kaggle>=1.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "xlsxwriter>=3.2",
  "jinja2>=3.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "jupyter>=1.0",
  "nbconvert>=7",
  "ipykernel>=6",
  "seaborn>=0.13",
]

[project.scripts]
stackscope = "stackscope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the built warehouse (run `make pipeline` first)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
